[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "premier-league-prediction-platform"
version = "0.1.0"
description = "Backend-first Premier League prediction, simulation and analytics platform"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "catboost==1.2.10",
    "numpy==2.5.3",
    "pydantic-settings==2.15.0",
    "tzdata==2026.3",
]

[project.scripts]
plp-download-historical = "pl_platform.ingestion.download:main"
plp-materialize-historical = "pl_platform.ingestion.materialize:main"
plp-materialize-features = "pl_platform.features.materialize:main"
plp-materialize-training = "pl_platform.training.materialize:main"
plp-evaluate-models = "pl_platform.evaluation.materialize:main"
plp-tune-catboost = "pl_platform.evaluation.catboost_materialize:main"
plp-evaluate-advanced-models = "pl_platform.evaluation.advanced_materialize:main"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pl_platform = ["py.typed"]

[tool.coverage.run]
branch = true
source = ["pl_platform"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["pl_platform"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
